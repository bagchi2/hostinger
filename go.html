<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="robots"
          content="noindex, nofollow, noarchive">

    <meta name="referrer"
          content="strict-origin-when-cross-origin">

    <title>Redirecting…</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f5f7fb;
            color: #1f2937;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .card {
            width: min(100%, 500px);
            padding: 40px 30px;
            text-align: center;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .loader {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            border: 5px solid #e8e8e8;
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(24px, 5vw, 30px);
            line-height: 1.2;
        }

        p {
            margin: 0;
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        small {
            display: block;
            margin-top: 18px;
            color: #888;
            font-size: 13px;
        }

        .error {
            color: #dc3545;
            font-weight: 700;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .loader {
                animation: none;
            }
        }
    </style>
</head>

<body>

<main class="card" aria-live="polite">

    <div
        class="loader"
        id="loader"
        role="status"
        aria-label="Redirecting">
    </div>

    <h1 id="title">Redirecting…</h1>

    <p id="message">
        Please wait while we securely redirect you.
    </p>

    <small id="status">
        Preparing redirect…
    </small>

</main>

<script>
(() => {
    "use strict";

    /*
     * ==========================================================
     * AFFILIATE LINKS
     * ==========================================================
     *
     * Add new affiliate links like:
     *
     * example: "https://example.com/affiliate"
     *
     * Then access:
     *
     * https://hostingercoupon.net/go.html?id=example
     */

    const links = Object.freeze({
        hostinger: "https://www.hostg.xyz/SHEtR"
    });

    /*
     * ==========================================================
     * DOM ELEMENTS
     * ==========================================================
     */

    const loader = document.getElementById("loader");
    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const status = document.getElementById("status");

    /*
     * ==========================================================
     * GET AFFILIATE ID
     * ==========================================================
     */

    const params = new URLSearchParams(window.location.search);

    const id = (params.get("id") || "")
        .trim()
        .toLowerCase();

    /*
     * ==========================================================
     * REDIRECT
     * ==========================================================
     */

    const destination = links[id];

    if (destination) {

        status.textContent = `Opening: ${id}`;

        /*
         * Small delay so the redirect message is actually visible.
         * 500ms is generally enough without unnecessarily slowing
         * the affiliate journey.
         */

        window.setTimeout(() => {
            window.location.replace(destination);
        }, 500);

    } else {

        loader.hidden = true;

        title.textContent = "404";

        message.textContent = "Affiliate link not found.";

        status.innerHTML =
            '<span class="error">Invalid or missing affiliate ID.</span>';
    }

})();
</script>

</body>
</html>
