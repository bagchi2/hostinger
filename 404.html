<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <style>
        /* CSS Styling */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .redirect-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 20px;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        /* Loading Spinner */
        .spinner {
            margin: 0 auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .file-reference {
            font-size: 11px;
            color: #aaa;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="redirect-container">
        <h1>Redirecting...</h1>
        <p>You are being safely redirected to the new destination.</p>
        <div class="spinner"></div>
        <p>If you are not redirected automatically, <a href="https://hostingercoupon.net" id="fallback-link">click here</a>.</p>
        
        <p class="file-reference">Reference file: image_0cb042.png</p>
    </div>

    <script>
        /* JavaScript Redirection Logic using the Spreadsheet Mapping */
        
        // 1. Map the old URL paths to the new full URLs
        const redirectMap = {
            "/cupom-de-desconto-hostinger-argentina": "https://hostingercoupon.net/cupom-de-descuento-hostinger-argentina",
            "/cupon-de-desconto-hostinger-colombia": "https://hostingercoupon.net/cupon-de-descuento-hostinger-colombia",
            "/slevovy-kod-hostinger-slevovy-kod-cesko": "https://hostingercoupon.net/slevovy-kod-hostinger-slevovy-kod-cesko-czech",
            "/hostinger-coupon-code-israel": "https://hostingercoupon.net/kod-kupon-hostinger-israel",
            "/code-promo-hostinger-egypt": "https://hostingercoupon.net/hostinger-discount-code-egypt"
        };

        // 2. Get the current path the user is visiting
        let currentPath = window.location.pathname;
        
        // Remove trailing slash if it exists (for exact matching)
        if (currentPath.length > 1 && currentPath.endsWith('/')) {
            currentPath = currentPath.slice(0, -1);
        }

        // 3. Determine target URL (fallback to homepage if not in list)
        let targetUrl = "https://hostingercoupon.net"; 
        if (redirectMap[currentPath]) {
            targetUrl = redirectMap[currentPath];
        }

        // 4. Update fallback link and Meta refresh dynamically
        document.getElementById('fallback-link').href = targetUrl;
        
        let metaTag = document.createElement('meta');
        metaTag.httpEquiv = "refresh";
        metaTag.content = "3;url=" + targetUrl;
        document.getElementsByTagName('head')[0].appendChild(metaTag);

        // 5. Execute the redirect after a short delay
        setTimeout(function() {
            window.location.replace(targetUrl);
        }, 2000);
    </script>

</body>
</html>
